# Standalone telemetry firmware. No UART/Modbus server or charging commands.
substitutions:
  device_name: twc-it-monitor
  twc_host: !secret twc_vitals_ip
  tibber_power_entity: sensor.tibber_246f2857d8f4_1_0_1_7_0
  tibber_l1_entity: sensor.tibber_246f2857d8f4_1_0_31_7_0
  tibber_l2_entity: sensor.tibber_246f2857d8f4_1_0_51_7_0
  tibber_l3_entity: sensor.tibber_246f2857d8f4_1_0_71_7_0

esphome:
  name: ${device_name}
  friendly_name: TWC IT Monitor
  includes:
    - it_energy_power.h

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

http_request:
  timeout: 5s

globals:
  - id: energy_average
    type: twc_it::EnergyPower
    restore_value: false

interval:
  - interval: 10s
    then:
      - http_request.get:
          url: http://${twc_host}/api/1/vitals
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  bool valid = false;
                  if (response->status_code == 200) {
                    json::parse_json(body, [&](JsonObject root) -> bool {
                      if (!root["session_energy_wh"].is<double>() ||
                          !root["session_s"].is<double>() ||
                          !root["uptime_s"].is<double>() ||
                          !root["contactor_closed"].is<bool>()) return false;
                      id(energy_average).sample(root["session_energy_wh"].as<double>(),
                          root["session_s"].as<double>(), root["uptime_s"].as<double>(),
                          root["contactor_closed"].as<bool>(), millis());
                      valid = id(energy_average).fresh(millis());
                      if (!valid) return false;
                      id(session_energy).publish_state(root["session_energy_wh"].as<float>());
                      if (root["voltageA_v"].is<float>() && root["currentA_a"].is<float>() &&
                          root["voltageB_v"].is<float>() && root["currentB_a"].is<float>() &&
                          root["voltageC_v"].is<float>() && root["currentC_a"].is<float>()) {
                        id(raw_channel_sum).publish_state(
                            root["voltageA_v"].as<float>() * root["currentA_a"].as<float>() +
                            root["voltageB_v"].as<float>() * root["currentB_a"].as<float>() +
                            root["voltageC_v"].as<float>() * root["currentC_a"].as<float>());
                      } else id(raw_channel_sum).publish_state(NAN);
                      return true;
                    });
                  }
                  if (!valid) {
                    id(energy_average).invalidate();
                    id(session_energy).publish_state(NAN);
                    id(raw_channel_sum).publish_state(NAN);
                  }
          on_error:
            then:
              - lambda: |-
                  id(energy_average).invalidate();
                  id(session_energy).publish_state(NAN);
                  id(raw_channel_sum).publish_state(NAN);

sensor:
  - platform: template
    name: Charging Power Energy Average 120s
    id: measured_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: return id(energy_average).value(millis());
  - platform: template
    name: Raw Voltage Current Channel Sum
    id: raw_channel_sum
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: Session Energy
    id: session_energy
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    update_interval: never
  - platform: homeassistant
    name: Tibber Total Power
    entity_id: ${tibber_power_entity}
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    internal: false
  - platform: homeassistant
    name: Tibber L1 Current
    entity_id: ${tibber_l1_entity}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    internal: false
  - platform: homeassistant
    name: Tibber L2 Current
    entity_id: ${tibber_l2_entity}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    internal: false
  - platform: homeassistant
    name: Tibber L3 Current
    entity_id: ${tibber_l3_entity}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    internal: false
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi Signal

binary_sensor:
  - platform: template
    name: Wall Connector Telemetry Fresh
    lambda: return id(energy_average).fresh(millis());
  - platform: status
    name: Connected
